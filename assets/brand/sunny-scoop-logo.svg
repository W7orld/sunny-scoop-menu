<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sunny Scoop logo">
  <title>Sunny Scoop</title>
  <!-- badge -->
  <circle cx="256" cy="256" r="252" fill="#fffefa"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#e94f83" stroke-width="10"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#76c9aa" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- sun rays -->
  <g stroke="#f6c746" stroke-width="12" stroke-linecap="round">
    <line x1="256" y1="46" x2="256" y2="72"/>
    <line x1="171" y1="64" x2="182" y2="88"/>
    <line x1="341" y1="64" x2="330" y2="88"/>
    <line x1="110" y1="115" x2="130" y2="133"/>
    <line x1="402" y1="115" x2="382" y2="133"/>
    <line x1="80" y1="186" x2="105" y2="193"/>
    <line x1="432" y1="186" x2="407" y2="193"/>
  </g>

  <!-- cone -->
  <clipPath id="cone"><path d="M206 232 L306 232 L256 340 Z"/></clipPath>
  <path d="M206 232 L306 232 L256 340 Z" fill="#e7b66b" stroke="#b9823a" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#b9823a" stroke-width="4" stroke-linecap="round" opacity=".7" clip-path="url(#cone)">
    <line x1="196" y1="232" x2="290" y2="345"/>
    <line x1="226" y1="232" x2="300" y2="321"/>
    <line x1="316" y1="232" x2="222" y2="345"/>
    <line x1="286" y1="232" x2="212" y2="321"/>
  </g>

  <!-- scoops -->
  <path d="M196 218 a60 56 0 0 1 120 0 q0 18 -14 18 q-8 14 -20 4 q-10 14 -24 4 q-12 12 -24 -2 q-14 8 -26 -4 q-12 -2 -12 -20 Z" fill="#76c9aa"/>
  <circle cx="256" cy="156" r="48" fill="#e94f83"/>
  <path d="M208 160 q8 22 24 16 q8 16 24 6 q16 12 28 -4 q14 4 16 -18 a48 48 0 0 1 -92 0 Z" fill="#c93669" opacity=".35"/>
  <ellipse cx="238" cy="140" rx="12" ry="7" fill="#fff" opacity=".45" transform="rotate(-30 238 140)"/>
  <!-- cherry -->
  <path d="M258 110 q4 -22 24 -30" fill="none" stroke="#23765f" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="114" r="12" fill="#d7263d"/>
  <circle cx="252" cy="110" r="3.5" fill="#fff" opacity=".6"/>

  <!-- wordmark -->
  <g font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif" font-weight="700" text-anchor="middle" fill="#141a2c">
    <text x="256" y="388" font-size="50" letter-spacing="6">SUNNY</text>
    <text x="256" y="436" font-size="50" letter-spacing="6" fill="#c93669">SCOOP</text>
  </g>
</svg>
